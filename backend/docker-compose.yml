services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: despensa-backend
    restart: unless-stopped
    ports:
      - "9099:9099"
    env_file:
      - .env
    environment:
      PORT: "9099"
      SQLITE_PATH: /app/data/encuestas_local.db
      # Credenciales de Base de Datos MySQL
      DB_HOST: 172.27.30.205
      DB_PORT: "3314"
      DB_USER: root
      DB_PASSWORD: admin
      DB_NAME: despensa
      # Configuración de CORS (Orígenes del Frontend en el puerto 8090)
      CORS_ORIGINS: "http://localhost:8090,http://172.27.30.205:8090,http://100.79.246.82:8090"
    volumes:
      - ./data:/app/data
