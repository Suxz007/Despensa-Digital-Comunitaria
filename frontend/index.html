<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Comunitaria Uniamazonia | Despensa Digital</title>
  <link rel="stylesheet" href="styles/styles.css?v=5.0" />
  <!-- React 18 + ReactDOM 18 + Babel para ejecutar JSX directamente en el navegador (sin build) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- El orden importa: cada archivo usa lo que definen los anteriores -->
  <!-- 1. Configuración y datos -->
  <script type="text/babel" src="src/config.jsx?v=5.0"></script>
  <script type="text/babel" src="src/data/encuesta.jsx?v=5.0"></script>
  <script type="text/babel" src="src/data/productos.jsx?v=5.0"></script>

  <!-- 2. Componentes reutilizables -->
  <script type="text/babel" src="src/components/Navbar.jsx?v=5.0"></script>
  <script type="text/babel" src="src/components/ProductCard.jsx?v=5.0"></script>
  <script type="text/babel" src="src/components/FilterPanel.jsx?v=5.0"></script>
  <script type="text/babel" src="src/components/Footer.jsx?v=5.0"></script>

  <!-- 3. Vistas (pantallas) -->
  <script type="text/babel" src="src/views/HomeView.jsx?v=5.0"></script>
  <script type="text/babel" src="src/views/ProductsView.jsx?v=5.0"></script>
  <script type="text/babel" src="src/views/DetailView.jsx?v=5.0"></script>
  <script type="text/babel" src="src/views/EncuestaUsabilidadView.jsx?v=5.0"></script>
  <script type="text/babel" src="src/views/AdminView.jsx?v=5.0"></script>
  <script type="text/babel" src="src/views/AdminEncuestasPanel.jsx?v=5.0"></script>

  <!-- 4. App principal y arranque -->
  <script type="text/babel" src="src/App.jsx?v=5.0"></script>
  <script type="text/babel" src="src/main.jsx?v=5.0"></script>
</body>
</html>
