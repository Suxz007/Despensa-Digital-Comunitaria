<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad | Iniciar sesión</title>

    <style>
        :root {
            --bg: #f3f6fb;
            --surface: #ffffff;
            --text: #172033;
            --muted: #6b7280;
            --primary: #3659e3;
            --primary-dark: #2947c7;
            --border: #e5eaf2;
            --danger: #b91c1c;
            --success: #16743a;
            --shadow: 0 18px 45px rgba(23, 32, 51, .09);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        button, input {
            font: inherit;
        }

        .login-screen {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.1fr .9fr;
        }

        .welcome-panel {
            padding: clamp(32px, 7vw, 90px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            background:
                radial-gradient(circle at 15% 15%, #5b7cff 0, transparent 32%),
                linear-gradient(145deg, #182a75, #3659e3 65%, #5977f5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 750;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: rgba(255,255,255,.18);
            border: 1px solid rgba(255,255,255,.25);
            font-size: 20px;
        }

        .welcome-copy {
            max-width: 540px;
            margin: 55px 0;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            font-weight: 700;
        }

        .welcome-copy h1 {
            font-size: clamp(38px, 5vw, 62px);
            line-height: 1.05;
            margin: 18px 0;
            letter-spacing: -2px;
        }

        .welcome-copy p {
            color: rgba(255,255,255,.82);
            font-size: 17px;
            line-height: 1.7;
            max-width: 430px;
        }

        .welcome-foot {
            color: rgba(255,255,255,.7);
            font-size: 13px;
        }

        .form-panel {
            display: grid;
            place-items: center;
            padding: 28px;
        }

        .login-card {
            width: min(100%, 420px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: clamp(26px, 4vw, 40px);
            box-shadow: var(--shadow);
        }

        .login-card h2 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subheading {
            margin: 0 0 30px;
            color: var(--muted);
            line-height: 1.5;
            font-size: 14px;
        }

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            border: 1px solid #d7deea;
            border-radius: 11px;
            padding: 13px 14px;
            background: #fbfcff;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(54,89,227,.13);
        }

        .primary-button {
            width: 100%;
            border: 0;
            border-radius: 11px;
            padding: 14px 16px;
            background: var(--primary);
            color: white;
            font-weight: 750;
            cursor: pointer;
        }

        .primary-button:hover {
            background: var(--primary-dark);
        }

        .primary-button:disabled {
            opacity: .65;
            cursor: wait;
        }

        .message {
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            color: var(--danger);
        }

        .message.success {
            color: var(--success);
        }

        @media (max-width: 780px) {
            .login-screen {
                grid-template-columns: 1fr;
            }

            .welcome-panel {
                padding: 25px;
                min-height: 280px;
            }

            .welcome-copy {
                margin: 35px 0 20px;
            }

            .welcome-copy h1 {
                font-size: 39px;
            }

            .welcome-foot {
                display: none;
            }

            .form-panel {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <section class="login-screen">

        <div class="welcome-panel">
            <div class="brand">
                <div class="brand-mark">C</div>
                <span>Comunidad</span>
            </div>

            <div class="welcome-copy">
                <div class="eyebrow">Tu espacio digital</div>
                <h1>Todo empieza con una sesión segura.</h1>
                <p>
                    Ingresa con tu usuario para acceder al panel
                    de la comunidad y consultar la información disponible.
                </p>
            </div>

            <div class="welcome-foot">
                © 2026 Comunidad · Panel de acceso
            </div>
        </div>

        <div class="form-panel">
            <form id="loginForm" class="login-card">

                <h2>Iniciar sesión</h2>
                <p class="subheading">
                    Introduce tus credenciales para continuar.
                </p>

                <div class="field">
                    <label for="username">Nombre de usuario</label>
                    <input
                        id="username"
                        name="nombre_usuario"
                        autocomplete="username"
                        placeholder="Ej. admin"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input
                        id="password"
                        name="credenciales"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Escribe tu contraseña"
                        required
                    >
                </div>

                <button
                    id="loginButton"
                    class="primary-button"
                    type="submit"
                >
                    Entrar al panel
                </button>

                <div
                    id="loginMessage"
                    class="message"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>
        </div>

    </section>

    <script src="login.js"></script>

</body>
</html>
