services:
  backend:
    build: ./backend
    container_name: despensa_backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false      # si no existe, se usan los valores por defecto del código
    volumes:
      # Guarda la base SQLite local (respaldo) fuera del contenedor
      - ./backend/data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: despensa_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Puerto oficial del subproyecto: http://localhost:8090
      - "8090:80"
